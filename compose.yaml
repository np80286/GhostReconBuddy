services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghost_recon_buddy
      POSTGRES_USER: ghost_recon_buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ghost_recon_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ghost_recon_buddy -d ghost_recon_buddy']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ghost_recon_data:
